<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 18px;
      margin: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #10b981;
      color: #022c22;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .specs {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      gap: 12px;
    }
    .video-wrap {
      width: 320px;
      height: 568px; /* 9:16 */
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #3b82f6;
      background: #000;
      box-shadow: 0 8px 30px rgba(59,130,246,0.25);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
    }
    .btn-download {
      background: #10b981;
      color: #fff;
    }
    .btn-youtube {
      background: #ef4444;
      color: #fff;
    }

</head>
<body>
  <div class="card">
    <h1>
      ClipForge AI — Exported 9:16 Short
      <span class="badge">1080x1920 READY</span>
    </h1>
    <div class="specs">
      <span>Resolution: <strong>1080x1920</strong></span>
      <span>•</span>
      <span>Codec: <strong>H.264 / AAC</strong></span>
      <span>•</span>

      <span>•</span>
      <span>Captions: <strong>Burned In</strong></span>

    <div class="video-wrap">

    <div class="actions">

    const player = document.getElementById('shortPlayer');
    player.addEventListener('loadedmetadata', () => {
      // Seek to second 2 to clearly show the burned captions
      player.currentTime = 2.0;
    });
  </script>

</html>
